name: Deploy to Render

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Validate Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Test build
        run: npm run build

  deploy:
    name: Trigger Render Deploy Hook
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Secret RENDER_DEPLOY_HOOK_URL is not configured in GitHub Secrets."
            echo "Please go to Settings -> Secrets and variables -> Actions and add RENDER_DEPLOY_HOOK_URL."
            exit 1
          fi

          echo "🚀 Calling Render deploy hook..."
          response=$(curl -s -S -w "\nHTTP_STATUS:%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
          http_code=$(echo "$response" | grep "HTTP_STATUS:" | cut -d':' -f2)
          body=$(echo "$response" | sed '/HTTP_STATUS:/d')

          echo "Render response: $body"

          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "✅ Render deploy hook triggered successfully (HTTP $http_code)!"
          else
            echo "::error::Render deploy hook failed with HTTP $http_code"
            exit 1
          fi
